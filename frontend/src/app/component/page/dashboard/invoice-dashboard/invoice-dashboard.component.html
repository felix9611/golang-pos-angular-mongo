<div class="bg-white p-[2rem] grid grid-cols-1 gap-3 w-full">
    <div class="grid grid-cols-1 lg:grid-cols-2 lg:flex gap-2 p-5 shawdow-lg border-2 border-[#A9A9A9] rounded-lg w-full">
        <div>
            <nz-range-picker
                nzSize="large"
                class="h-full w-full"
                name="date"
                [nzShowTime]="{ nzFormat: 'HH:mm' }"
                nzFormat="yyyy-MM-dd HH:mm:ss"
                [(ngModel)]="globalFilter.salesDateRange"
            ></nz-range-picker>
        </div>
        <div class="lg:w-[350px] h-full">
            <app-filter-list-small
                label="Product Type"
                [apiUrl]="'/product/product-type/filter/list'"
                [requestBody]="productTypeSearchForm"
                [postApi]="loadTypeLists"
                [multiple]="true"
                [searchDataKey]="['name']"
                [(value)]="globalFilter.typeIds"
                (valueChange)="globalFilter.typeIds"
            />
        </div>
        <div class="lg:w-[350px] h-full">
            <app-filter-list-small
                label="Location"
                [apiUrl]="'/base/location/filter/list'"
                [requestBody]="placeSearchForm"
                [postApi]="loadPlaceLists"
                [multiple]="true"
                [searchDataKey]="['placeCode', 'placeName']"
                [(value)]="globalFilter.placeIds"
                (valueChange)="globalFilter.placeIds"
            />
        </div>
        <div class="lg:w-[350px] h-full">
            <app-filter-list-small
                label="Department"
                [apiUrl]="'/sys/department/filter/list'"
                [requestBody]="departmentSearchForm"
                [postApi]="loadDeptLists"
                [multiple]="true"
                [searchDataKey]="['name']"
                [(value)]="globalFilter.deptIds"
                (valueChange)="globalFilter.deptIds"
            />
        </div>
        <div (click)="runSearch()" class="w-[100px]  border-1 border-[#54A4FF] hover:bg-[#2E7FDB] text-center px-1 py-2 rounded-lg">
            Search
        </div>
    </div>

    <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
        <div class="font-bold">Total Qtys Sales by Year & Month</div>
        <app-chart class="w-[100%]" *ngIf="byYearMonthAndQtysLoading" [(chartData)]="byYearMonthAndQtys" />
    </div>

    <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
        <div class="font-bold">Total Price Sales by Year & Month</div>
        <app-chart class="w-[100%]" *ngIf="byYearMonthAndPriceLoading" [(chartData)]="byYearMonthAndPrice" />
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
        <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
            <div class="font-bold">Total Qtys Sales by per Product Type</div>
            <app-chart class="w-[100%]" *ngIf="byTypeAndQtysLoading" [(chartData)]="byTypeAndQtys" />
        </div>
        <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
            <div class="font-bold">Total Price Sales by per Product Type</div>
            <app-chart class="w-[100%]" *ngIf="byTypeAndPriceLoading" [(chartData)]="byTypeAndPrice" />
        </div>
        <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
            <div class="font-bold">Total Qtys Sales by per Department</div>
            <app-chart class="w-[100%]" *ngIf="byDeptAndQtysLoading" [(chartData)]="byDeptAndQtys" />
        </div>
        <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
            <div class="font-bold">Total Price Sales by per Department</div>
            <app-chart class="w-[100%]" *ngIf="byDeptAndPriceLoading" [(chartData)]="byDeptAndPrice" />
        </div>
        <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
            <div class="font-bold">Total Qtys Sales by per Location</div>
            <app-chart class="w-[100%]" *ngIf="byLocationAndQtysLoading" [(chartData)]="byLocationAndQtys" />
        </div>
        <div class="p-2 shawdow-lg border-2 border-[#A9A9A9] rounded-lg">
            <div class="font-bold">Total Price Sales by per Location</div>
            <app-chart class="w-[100%]" *ngIf="byLocationAndPriceLoading" [(chartData)]="byLocationAndPrice" />
        </div>
        
    </div>

</div>
